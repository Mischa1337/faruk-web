# Steuert, was GitHub Pages veröffentlicht.
#
# Ohne diese Datei wäre ALLES im Projektordner unter der echten Domain
# abrufbar – auch daten.txt mit Faruks Adresse und Telefonnummer.
# Die Dateien bleiben im Repository (Git ist die Sicherung, und setup.py
# braucht daten.txt), sie landen nur nicht auf der Website.
#
# .nojekyll wäre hier der falsche Griff: Das würde die Verarbeitung ganz
# abschalten und damit erst recht alles ausliefern.
exclude:
  - README.md
  - HEUTE.md
  - FUER-FARUK.md
  - FUER-FARUK.pdf
  - daten.txt
  - setup.py
  # Farbwähler ist nur zum lokalen Ausprobieren gedacht. Soll Faruk ihn
  # unterwegs vom Handy aus anschauen können: diese Zeile löschen.
  - farben.html
  - .vorlage
  - .claude
  - __pycache__
