# Contact worker (worker/): tests and bundles it on every change and deploys
# it to Cloudflare from main. Linting runs in site.yml with the rest of the repo.
#
# Deploying needs two repository settings (Settings → Secrets and variables → Actions):
#   variable CLOUDFLARE_ACCOUNT_ID  Cloudflare account ID (not secret)
#   secret   CLOUDFLARE_API_TOKEN   API token from the "Edit Cloudflare Workers" template
# Until the variable exists, the deploy step is skipped.
# The worker's own secrets (SMTP_PASSWORD, HEALTH_TOKEN) never pass through
# GitHub – they are set once with `wrangler secret put` (see worker/README.md).
name: Worker

on:
  push:
    branches: [main]
    paths:
      - worker/**
      - src/scripts/modules/contact-form/validation.js
      - .github/workflows/worker.yml
  pull_request:
    paths:
      - worker/**
      - src/scripts/modules/contact-form/validation.js
      - .github/workflows/worker.yml
  workflow_dispatch:

permissions:
  contents: read

# One group per pull request and one per branch (see site.yml for why the
# pull request number is needed)
concurrency:
  group: worker-${{ github.event.pull_request.number || github.ref }}
  # Never abort a deploy halfway
  cancel-in-progress: false

jobs:
  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - run: npm ci
      - run: npm test
      # Bundles without uploading – catches import and config errors on every PR
      - run: npm run build

      # Pushes to main only – a pull request that is already merged also
      # reports main as its ref, but must never deploy
      - name: Deploy to Cloudflare
        if: >-
          github.event_name != 'pull_request' && github.ref == 'refs/heads/main' &&
          vars.CLOUDFLARE_ACCOUNT_ID != ''
        run: npx wrangler deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
