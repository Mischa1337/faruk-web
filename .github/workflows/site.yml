# Checks every change and publishes the site to GitHub Pages from main.
#
#   check       formatting, linting, build, HTML validation, tests
#   lighthouse  performance / accessibility / SEO budgets, mobile and desktop (lighthouserc.json)
#   deploy      only on main: publishes _site/ to GitHub Pages
name: Site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for the sitemap's lastmod date

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run lint
      # Tests build their own copy of the site, so they run before the real build
      - run: npm test

      - name: Configure Pages
        id: pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Build
        run: npm run build
        env:
          # Sub-path of the GitHub Pages URL; empty once the custom domain is active
          PATH_PREFIX: ${{ steps.pages.outputs.base_path }}/

      - run: npm run validate

      - name: Upload site for GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site/

  lighthouse:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Built without PATH_PREFIX, because Lighthouse serves _site/ from the root
      - run: npm run build
      # Mobile first: Google ranks the mobile version of a page
      - name: Run Lighthouse CI (mobile)
        run: npx --yes @lhci/cli@0.15.1 autorun --upload.outputDir=lighthouse-reports/mobile
      - name: Run Lighthouse CI (desktop)
        if: always()
        run: >-
          npx --yes @lhci/cli@0.15.1 autorun --collect.settings.preset=desktop
          --upload.outputDir=lighthouse-reports/desktop
      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: lighthouse-reports/

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: [check, lighthouse]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
