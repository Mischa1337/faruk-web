<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 850" role="img"
     aria-label="Platzhalter für das Porträtfoto">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1D1D24"/>
      <stop offset="1" stop-color="#0F0F13"/>
    </linearGradient>
  </defs>

  <rect width="700" height="850" fill="url(#bg2)"/>

  <!-- Person -->
  <g transform="translate(350 350)" stroke="#FF7A3D" stroke-width="10" fill="none" opacity=".8"
     stroke-linecap="round" stroke-linejoin="round">
    <circle cx="0" cy="-55" r="62"/>
    <path d="M-110 105a110 110 0 0 1 220 0"/>
  </g>

  <text x="350" y="560" font-family="Helvetica, Arial, sans-serif" font-size="31" font-weight="700"
        text-anchor="middle" fill="#F4F4F5">Porträtfoto hier einfügen</text>
  <text x="350" y="604" font-family="Helvetica, Arial, sans-serif" font-size="21"
        text-anchor="middle" fill="#A0A0AB">Hochformat 4:5 · freundlich, gut belichtet</text>
  <text x="350" y="644" font-family="Helvetica, Arial, sans-serif" font-size="20"
