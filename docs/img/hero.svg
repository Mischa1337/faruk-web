<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" role="img"
     aria-label="Platzhalter für das Hauptfoto">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1D1D24"/>
      <stop offset="1" stop-color="#101014"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF5C1A" stop-opacity=".22"/>
      <stop offset="1" stop-color="#FF5C1A" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="800" height="1000" fill="url(#bg)"/>
  <rect width="800" height="620" fill="url(#glow)"/>

  <!-- Hantel -->
  <g transform="translate(400 430)" stroke="#FF7A3D" stroke-width="9" stroke-linecap="round" fill="none" opacity=".85">
    <path d="M-118 0h236"/>
    <path d="M-118 -42v84M118 -42v84"/>
    <path d="M-152 -66v132M152 -66v132"/>
  </g>

  <text x="400" y="600" font-family="Helvetica, Arial, sans-serif" font-size="34" font-weight="700"
        text-anchor="middle" fill="#F4F4F5">Hauptfoto hier einfügen</text>
  <text x="400" y="646" font-family="Helvetica, Arial, sans-serif" font-size="23"
        text-anchor="middle" fill="#A0A0AB">Hochformat 4:5 · z.&#160;B. 1200&#160;×&#160;1500&#160;px</text>
  <text x="400" y="690" font-family="Helvetica, Arial, sans-serif" font-size="21"
        text-anchor="middle" fill="#74747F">ersetzt: img/hero.jpg</text>
</svg>
